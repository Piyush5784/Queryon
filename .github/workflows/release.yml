name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-r2-token:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -sf -X GET "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" | tee /tmp/verify.json
          echo
          if grep -q '"success":true' /tmp/verify.json; then
            echo "Token is valid"
          else
            echo "Token verification failed"
            exit 1
          fi

  release:
    needs: verify-r2-token
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: "--bundles deb,rpm"
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.platform }}-${{ matrix.args }}
          cache-directories: |
            !apps/desktop/src-tauri/target/**/duckdb-download

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Queryon ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install for your platform."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload installers to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MATRIX_ARGS: ${{ matrix.args }}
        shell: bash
        run: |
          set -euo pipefail

          latest_suffix=""
          case "$MATRIX_ARGS" in
            *aarch64-apple-darwin*) latest_suffix="-arm64" ;;
            *x86_64-apple-darwin*) latest_suffix="-x86_64" ;;
          esac

          upload() {
            local bundle_dir="$1"
            local ext="$2"
            local dir="apps/desktop/src-tauri/target"
            [[ -d "$dir" ]] || return 0
            find "$dir" -type f -path "*/bundle/${bundle_dir}/*.${ext}" | while IFS= read -r f; do
              echo "Uploading $f"
              pnpm dlx wrangler r2 object put \
                "queryon-releases/${GITHUB_REF_NAME}/$(basename "$f")" \
                --file "$f" --remote
              pnpm dlx wrangler r2 object put \
                "queryon-releases/latest/queryon${latest_suffix}.${ext}" \
                --file "$f" --remote
            done
          }

          upload deb deb
          upload rpm rpm
          upload msi msi
          upload nsis exe
          upload dmg dmg
          exit 0
