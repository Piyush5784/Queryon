services:
  postgres:
    image: postgres:16
    container_name: queryon-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: devdb
    ports:
      # Non-default host port so this doesn't collide with a Postgres
      # instance you might already have running locally on 5432, 55432,
      # or 55433.
      - "55434:5432"
    volumes:
      # No named data volume — this container is ephemeral by design so
      # `docker compose down` always gives back the clean seed state.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d devdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-samples:
    image: postgres:16
    container_name: queryon-pg-samples
    restart: unless-stopped
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: samples
    ports:
      - "55435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d samples"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4
    container_name: queryon-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: devpass
      MYSQL_DATABASE: devdb
      MYSQL_USER: devuser
      MYSQL_PASSWORD: devpass
    ports:
      - "33066:3306"
    volumes:
      - ./docker/initdb-mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "devuser", "-pdevpass"]
      interval: 5s
      timeout: 5s
      retries: 10

